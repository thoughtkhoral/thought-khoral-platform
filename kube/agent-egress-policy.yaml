apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thought-khoral-agent-egress
  namespace: thought-khoral-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: thought-khoral-agent-gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thought-khoral-room-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: thought-khoral-keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
