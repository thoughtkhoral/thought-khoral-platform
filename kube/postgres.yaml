apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thought-khoral-postgres-data
  namespace: thought-khoral-dev
  labels:
    app.kubernetes.io/name: thought-khoral-postgres
    app.kubernetes.io/part-of: thought-khoral
    thought-khoral.redhat.com/environment: development-only
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thought-khoral-postgres
  namespace: thought-khoral-dev
  labels:
    app.kubernetes.io/name: thought-khoral-postgres
    app.kubernetes.io/part-of: thought-khoral
    thought-khoral.redhat.com/environment: development-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thought-khoral-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thought-khoral-postgres
        app.kubernetes.io/part-of: thought-khoral
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: thought-khoral-postgres
          image: localhost/thought-khoral-postgres:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_DB
              value: n2n
            - name: POSTGRES_USER
              value: n2n
            - name: POSTGRES_PASSWORD
              value: n2n-dev-only
          ports:
            - name: postgres
              containerPort: 5432
              hostPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, n2n, -d, n2n]
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thought-khoral-postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thought-khoral-postgres
  namespace: thought-khoral-dev
  labels:
    app.kubernetes.io/name: thought-khoral-postgres
    app.kubernetes.io/part-of: thought-khoral
spec:
  selector:
    app.kubernetes.io/name: thought-khoral-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
