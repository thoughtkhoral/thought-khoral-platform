apiVersion: apps/v1
kind: Deployment
metadata:
  name: thought-khoral-room-gateway
  namespace: thought-khoral-dev
  labels:
    app.kubernetes.io/name: thought-khoral-room-gateway
    app.kubernetes.io/part-of: thought-khoral
    thought-khoral.redhat.com/environment: development-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: thought-khoral-room-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thought-khoral-room-gateway
        app.kubernetes.io/part-of: thought-khoral
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: thought-khoral-room-gateway
          image: localhost/thought-khoral-room-gateway:dev
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgres://n2n:thought-khoral-dev-only@thought-khoral-postgres:5432/n2n
            - name: THOUGHT_KHORAL_ALLOWED_ORIGINS
              value: http://localhost:8082
            - name: THOUGHT_KHORAL_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: THOUGHT_KHORAL_OIDC_AUDIENCE
              value: thought-khoral-workspace
            - name: THOUGHT_KHORAL_OIDC_ISSUER
              value: http://localhost:8081/realms/thought-khoral
            - name: THOUGHT_KHORAL_OIDC_JWKS_URL
              value: http://thought-khoral-keycloak:8080/realms/thought-khoral/protocol/openid-connect/certs
            - name: THOUGHT_KHORAL_SESSION_AUTH_TIMEOUT_MS
              value: "5000"
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thought-khoral-room-gateway
  namespace: thought-khoral-dev
  labels:
    app.kubernetes.io/name: thought-khoral-room-gateway
    app.kubernetes.io/part-of: thought-khoral
spec:
  selector:
    app.kubernetes.io/name: thought-khoral-room-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
