apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: n2n-dev
  labels:
    app.kubernetes.io/name: gateway
    n2n.redhat.com/environment: development-only
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: localhost/n2n-gateway:dev
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgres://n2n:n2n-dev-only@postgres:5432/n2n
            - name: N2N_ALLOWED_ORIGINS
              value: http://localhost:8082
            - name: N2N_LISTEN_ADDRESS
              value: 0.0.0.0:8080
            - name: N2N_OIDC_AUDIENCE
              value: n2n-workspace
            - name: N2N_OIDC_ISSUER
              value: http://localhost:8081/realms/n2n
            - name: N2N_OIDC_JWKS_URL
              value: http://keycloak:8080/realms/n2n/protocol/openid-connect/certs
            - name: N2N_SESSION_AUTH_TIMEOUT_MS
              value: "5000"
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: n2n-dev
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
