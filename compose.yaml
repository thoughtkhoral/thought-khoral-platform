name: thought-khoral

services:
  thought-khoral-postgres:
    build:
      context: ..
      dockerfile: thought-khoral-platform/containers/postgres.Containerfile
    image: localhost/thought-khoral-postgres:dev
    environment:
      POSTGRES_DB: n2n
      POSTGRES_PASSWORD: thought-khoral-dev-only
      POSTGRES_USER: n2n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n2n -d n2n"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:5432:5432"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - thought-khoral-postgres-data:/var/lib/postgresql/data

  thought-khoral-keycloak:
    build:
      context: ..
      dockerfile: thought-khoral-platform/containers/keycloak.Containerfile
    image: localhost/thought-khoral-keycloak:dev
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      thought-khoral-postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: thought-khoral-admin-dev-only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: postgres
      KC_DB_PASSWORD: thought-khoral-dev-only
      KC_DB_URL: jdbc:postgresql://thought-khoral-postgres:5432/keycloak
      KC_DB_USERNAME: n2n
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 36
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /opt/keycloak/data/tmp
      - /tmp

  thought-khoral-room-gateway:
    build:
      context: ..
      dockerfile: thought-khoral-platform/containers/gateway.Containerfile
    image: localhost/thought-khoral-room-gateway:dev
    depends_on:
      thought-khoral-keycloak:
        condition: service_healthy
      thought-khoral-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://n2n:thought-khoral-dev-only@thought-khoral-postgres:5432/n2n
      THOUGHT_KHORAL_ALLOWED_ORIGINS: http://localhost:8082
      THOUGHT_KHORAL_LISTEN_ADDRESS: 0.0.0.0:8080
      THOUGHT_KHORAL_OIDC_AUDIENCE: thought-khoral-workspace
      THOUGHT_KHORAL_OIDC_ISSUER: http://localhost:8081/realms/thought-khoral
      THOUGHT_KHORAL_OIDC_JWKS_URL: http://thought-khoral-keycloak:8080/realms/thought-khoral/protocol/openid-connect/certs
      THOUGHT_KHORAL_SESSION_AUTH_TIMEOUT_MS: "5000"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ws)" = 400
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  thought-khoral-workspace-ui:
    build:
      context: ..
      dockerfile: thought-khoral-platform/containers/ui.Containerfile
    image: localhost/thought-khoral-workspace-ui:dev
    depends_on:
      thought-khoral-room-gateway:
        condition: service_healthy
      thought-khoral-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:8082:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  thought-khoral-network:
    name: thought-khoral-network

volumes:
  thought-khoral-postgres-data:
    name: thought-khoral-postgres-data
