name: thought-khoral

services:
  thought-khoral-postgres:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/postgres.Containerfile
    image: localhost/thought-khoral-postgres:dev
    environment:
      POSTGRES_DB: n2n
      POSTGRES_PASSWORD: n2n-dev-only
      POSTGRES_USER: n2n
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n2n -d n2n"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:5432:5432"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - thought-khoral-postgres-data:/var/lib/postgresql/data

  thought-khoral-keycloak:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/keycloak.Containerfile
    image: localhost/thought-khoral-keycloak:dev
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      thought-khoral-postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: n2n-admin-dev-only
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: postgres
      KC_DB_PASSWORD: n2n-dev-only
      KC_DB_URL: jdbc:postgresql://thought-khoral-postgres:5432/keycloak
      KC_DB_USERNAME: n2n
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 36
    networks:
      - thought-khoral-network
      - thought-khoral-agent-internal
    ports:
      - "127.0.0.1:8081:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /opt/keycloak/data/tmp
      - /tmp

  thought-khoral-room-gateway:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/gateway.Containerfile
    image: localhost/thought-khoral-room-gateway:dev
    depends_on:
      thought-khoral-memory-engine:
        condition: service_healthy
      thought-khoral-keycloak:
        condition: service_healthy
      thought-khoral-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://n2n:n2n-dev-only@thought-khoral-postgres:5432/n2n
      THOUGHT_KHORAL_ALLOWED_ORIGINS: http://localhost:8082
      THOUGHT_KHORAL_LISTEN_ADDRESS: 0.0.0.0:8080
      THOUGHT_KHORAL_OIDC_AUDIENCE: thought-khoral-workspace
      THOUGHT_KHORAL_OIDC_ISSUER: http://localhost:8081/realms/thought-khoral
      THOUGHT_KHORAL_OIDC_JWKS_URL: http://thought-khoral-keycloak:8080/realms/thought-khoral/protocol/openid-connect/certs
      THOUGHT_KHORAL_SESSION_AUTH_TIMEOUT_MS: "5000"
      THOUGHT_KHORAL_MEMORY_ENGINE_URL: http://thought-khoral-memory-engine:43121/internal/v1/ingest
      THOUGHT_KHORAL_MEMORY_ENGINE_SHARED_SECRET: thought-khoral-memory-dev-only
      THOUGHT_KHORAL_MEMORY_ENGINE_TIMEOUT_MS: "100"
      THOUGHT_KHORAL_MEMORY_ENGINE_QUEUE_CAPACITY: "64"
    healthcheck:
      test:
        - CMD-SHELL
        - test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ws)" = 400
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
      - thought-khoral-agent-internal
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  thought-khoral-memory-engine:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/memory-engine.Containerfile
    image: localhost/thought-khoral-memory-engine:dev
    environment:
      THOUGHT_KHORAL_MEMORY_LISTEN_ADDRESS: 0.0.0.0:43121
      THOUGHT_KHORAL_MEMORY_SHARED_SECRET: thought-khoral-memory-dev-only
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:43121/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  # Trusted setup installs default-deny kernel egress before either agent starts.
  thought-khoral-agent-egress:
    container_name: thought-khoral-agent-egress
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/agent-egress.Containerfile
    image: localhost/thought-khoral-agent-egress:dev
    command: ["--hold"]
    depends_on:
      thought-khoral-keycloak:
        condition: service_healthy
      thought-khoral-room-gateway:
        condition: service_healthy
    networks:
      - thought-khoral-agent-internal
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/egress-ready"]
      interval: 2s
      timeout: 1s
      retries: 30

  # Both agents share loopback, with distinct UIDs enforced by the filter.
  thought-khoral-reference-agent:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/reference-agent.Containerfile
    image: localhost/thought-khoral-reference-agent:dev
    depends_on:
      thought-khoral-agent-egress:
        condition: service_healthy
    environment:
      THOUGHT_KHORAL_REFERENCE_AGENT_INBOUND_SECRET: reference-agent-inbound-dev-only
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          --header "Authorization: Bearer $$THOUGHT_KHORAL_REFERENCE_AGENT_INBOUND_SECRET"
          http://127.0.0.1:9090/.well-known/agent-card.json
      interval: 2s
      timeout: 3s
      retries: 30
    network_mode: service:thought-khoral-agent-egress
    pid: container:thought-khoral-agent-egress
    cap_drop: [ALL]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10002:10002"

  thought-khoral-agent-gateway:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/agent-gateway.Containerfile
    image: localhost/thought-khoral-agent-gateway:dev
    restart: on-failure:3
    depends_on:
      thought-khoral-keycloak:
        condition: service_healthy
      thought-khoral-reference-agent:
        condition: service_healthy
      thought-khoral-room-gateway:
        condition: service_healthy
    environment:
      THOUGHT_KHORAL_AGENT_GATEWAY_CLIENT_ID: thought-khoral-agent-gateway
      THOUGHT_KHORAL_AGENT_GATEWAY_CLIENT_SECRET: agent-gateway-client-dev-only
      THOUGHT_KHORAL_AGENT_POLL_MILLIS: "250"
      THOUGHT_KHORAL_ALLOWED_HANDOFF_HOSTS: reference-agent.thought-khoral.local
      THOUGHT_KHORAL_KEYCLOAK_TOKEN_URL: http://thought-khoral-keycloak:8080/realms/thought-khoral/protocol/openid-connect/token
      THOUGHT_KHORAL_REFERENCE_AGENT_CARD_URL: http://127.0.0.1:9090/.well-known/agent-card.json
      THOUGHT_KHORAL_REFERENCE_AGENT_INBOUND_SECRET: reference-agent-inbound-dev-only
      THOUGHT_KHORAL_REFERENCE_AGENT_HANDOFF_HOST: reference-agent.thought-khoral.local
      THOUGHT_KHORAL_ROOM_GATEWAY_ORIGIN: http://thought-khoral-room-gateway:8080/
    network_mode: service:thought-khoral-agent-egress
    pid: container:thought-khoral-agent-egress
    cap_drop: [ALL]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: "10001:10001"

  thought-khoral-workspace-ui:
    build:
      context: ${THOUGHT_KHORAL_SOURCE_ROOT:-..}
      dockerfile: thought-khoral-platform/containers/ui.Containerfile
    image: localhost/thought-khoral-workspace-ui:dev
    depends_on:
      thought-khoral-room-gateway:
        condition: service_healthy
      thought-khoral-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - thought-khoral-network
    ports:
      - "127.0.0.1:8082:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

networks:
  thought-khoral-agent-internal:
    internal: true
  thought-khoral-network:
    name: thought-khoral-network

volumes:
  thought-khoral-postgres-data:
    external: true
    name: n2n_postgres-data
